name: openrouter-voice
version: 1.4.0
description: "OpenRouter for both voice directions — stt.provider / tts.provider = openrouter, reusing OPENROUTER_API_KEY. Handles the request shapes these endpoints actually accept (json/verbose_json transcription, 16 kHz mono WAV where a model demands it, vendor-prefixed speech slugs with model-specific voices). Ships the stt.providers / tts.providers command shims that make both names selectable in the desktop Voice tab."
author: "esketids"
license: "MIT"
homepage: "https://github.com/esketids/hermes-openrouter-voice"
tags:
  - voice
  - speech-to-text
  - text-to-speech
  - openrouter
requires_env:
  - OPENROUTER_API_KEY
requires_hermes: ">=0.21"
